[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precut"
version = "0.4.0"
description = "프리미어 프로용 무음 컷편집 · 소리 밸런스 · 자막 자동화 도구"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["premiere", "video-editing", "silence-removal", "subtitles", "loudness", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.23"]
subtitles = ["faster-whisper>=1.0"]
ffmpeg = ["imageio-ffmpeg>=0.4"]
all = ["numpy>=1.23", "faster-whisper>=1.0", "imageio-ffmpeg>=0.4"]
dev = ["pytest>=7", "numpy>=1.23", "imageio-ffmpeg>=0.4"]

[project.scripts]
precut = "precut.cli:main"

[tool.setuptools]
packages = ["precut", "precut.exporters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
